[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mvave"
version = "0.2.0"
description = "Talk to M-VAVE pedals (M-EFCS protocol) over USB without the editor: presets, models, knobs, block on/off, globals, re-amp; MK-300 profile with its 359-model catalog."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "mido>=1.3", "python-rtmidi>=1.5",
    "tone-analyzer @ git+https://github.com/jpfaria/tone-analyzer@v0.1.0",
]

[project.optional-dependencies]
dev = ["pytest", "sounddevice>=0.5", "soundfile>=0.12", "numpy>=1.26"]
reamp = ["sounddevice>=0.5", "soundfile>=0.12", "numpy>=1.26"]

[project.scripts]
mvave = "mvave.cli:main"

[tool.setuptools.packages.find]
include = ["mvave*"]

[tool.setuptools.package-data]
"mvave.devices" = ["*_catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
