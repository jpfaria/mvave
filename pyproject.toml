[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mk300"
version = "0.1.0"
description = "Talk to the M-VAVE MK-300 over USB (SysEx) without the M-EFCS editor: presets, models, knobs, block on/off, globals, catalog of the 359 models."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "mido>=1.3", "python-rtmidi>=1.5",
    "tone-analyzer @ git+https://github.com/jpfaria/tone-analyzer@v0.1.0",
]

[project.optional-dependencies]
dev = ["pytest", "sounddevice>=0.5", "soundfile>=0.12", "numpy>=1.26"]
reamp = ["sounddevice>=0.5", "soundfile>=0.12", "numpy>=1.26"]

[project.scripts]
mk300 = "mk300.cli:main"

[tool.setuptools.packages.find]
include = ["mk300*"]

[tool.setuptools.package-data]
mk300 = ["catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
